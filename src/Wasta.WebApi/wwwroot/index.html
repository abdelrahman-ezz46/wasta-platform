<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wasta</title>
<script>
  // Cache-bust the stylesheet and script.
  //
  // This app is only served in Development or behind an explicit Demo:Enabled,
  // and a browser holding a stale app.js means you debug code that is no longer
  // running - which cost real time once already. Correctness beats caching here.
  const v = Date.now();
  document.write(
    '<link rel="stylesheet" href="/app.css?v=' + v + '" />' +
    '<scr' + 'ipt src="/app.js?v=' + v + '" defer><\/scr' + 'ipt>');
</script>
</head>
<body>
  <div id="shell"></div>
</body>
</html>
