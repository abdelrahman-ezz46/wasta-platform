name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore WastaCareerCoach.sln

      # Warnings have been driven to zero, so keep them there rather than
      # letting them creep back one PR at a time.
      - name: Build
        run: dotnet build WastaCareerCoach.sln --no-restore --warnaserror

      - name: Test
        run: dotnet test WastaCareerCoach.sln --no-build --verbosity normal

  frontend:
    name: Typecheck (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [coach-card, chat-widget]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: src/frontend/${{ matrix.package }}
        run: npm ci || npm install

      - name: Typecheck
        working-directory: src/frontend/${{ matrix.package }}
        run: npx tsc --noEmit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credentials have been pasted into chat during development more than
      # once, so treat a key reaching this repo as a live risk rather than a
      # theoretical one. The Google "AQ."/"ya29." forms are here because an
      # earlier version of this pattern only matched "AIza" and would have
      # missed a real token.
      - name: Check for committed credentials
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|appsettings\.(Development|Local|Production)\.json$'; then
            echo "::error::A file that should hold secrets is tracked in git."
            exit 1
          fi
          if git grep -nIE '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}|(AQ|ya29)\.[A-Za-z0-9_-]{20,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})' -- . ; then
            echo "::error::A value matching an API key or token pattern is committed. Revoke it, then remove it from history."
            exit 1
          fi
          echo "No committed credentials found."
